# libs.versions.toml — Student OS
# Single source of truth for all dependency versions.
# All build.gradle.kts files reference this catalog; no version literals
# appear anywhere else in the project.

[versions]
# ── SDK ──────────────────────────────────────────────────────────────────────
compileSdk          = "35"
minSdk              = "26"
targetSdk           = "35"

# ── Kotlin & KSP ─────────────────────────────────────────────────────────────
# KSP version format is {kotlinVersion}-{kspVersion}.
# 2.0.21-1.0.28 is the correct KSP release for Kotlin 2.0.21.
kotlin              = "2.0.21"
ksp                 = "2.0.21-1.0.28"

# ── Lint ──────────────────────────────────────────────────────────────────────
# Lint API version = AGP major + 23.  AGP 8.7.3 → Lint 31.7.3.
lint                = "31.7.3"

# ── Android Gradle Plugin ────────────────────────────────────────────────────
agp                 = "8.7.3"

# ── AndroidX Core ────────────────────────────────────────────────────────────
coreKtx             = "1.15.0"
appcompat           = "1.7.0"

# ── Jetpack Compose ──────────────────────────────────────────────────────────
composeBom          = "2024.12.01"
activityCompose     = "1.9.3"
navigationCompose   = "2.8.5"
lifecycleCompose    = "2.8.7"

# ── Hilt ─────────────────────────────────────────────────────────────────────
# 2.56.1 is the latest stable version compatible with AGP 8.7.x.
# 2.56.2 had a known ZipException bug (github.com/google/dagger/issues/4803).
# 2.57 breaks instrumented test compilation (issue #4898). Use 2.56.1.
hilt                = "2.56.1"
hiltNavigationCompose = "1.2.0"

# ── Room ─────────────────────────────────────────────────────────────────────
room                = "2.6.1"

# ── WorkManager ──────────────────────────────────────────────────────────────
workManager         = "2.10.0"
hiltWork            = "1.2.0"

# ── Retrofit & OkHttp ────────────────────────────────────────────────────────
retrofit            = "2.11.0"
okhttp              = "4.12.0"
kotlinxSerialization = "1.7.3"
retrofitKotlinxConverter = "1.0.0"

# ── Jetpack Security (EncryptedSharedPreferences) ────────────────────────────
securityCrypto      = "1.1.0-alpha06"

# ── ML Kit (OCR) ─────────────────────────────────────────────────────────────
mlkitTextRecognition = "16.0.1"

# ── Testing ──────────────────────────────────────────────────────────────────
junit               = "4.13.2"
junitAndroid        = "1.2.1"
espresso            = "3.6.1"
composeUiTest       = "1.7.6"
mockk               = "1.13.13"
kotest              = "5.9.1"
turbine             = "1.2.0"
roomTesting         = "2.6.1"


[libraries]
# ── AndroidX Core ────────────────────────────────────────────────────────────
androidx-core-ktx           = { group = "androidx.core",          name = "core-ktx",                  version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat",     name = "appcompat",                 version.ref = "appcompat" }

# ── Jetpack Compose BOM ──────────────────────────────────────────────────────
# Importing the BOM ensures all Compose library versions are aligned.
compose-bom                 = { group = "androidx.compose",       name = "compose-bom",               version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",    name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",    name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling          = { group = "androidx.compose.ui",    name = "ui-tooling" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",    name = "ui-test-manifest" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",    name = "ui-test-junit4" }

# ── Activity & Navigation ────────────────────────────────────────────────────
activity-compose            = { group = "androidx.activity",      name = "activity-compose",          version.ref = "activityCompose" }
navigation-compose          = { group = "androidx.navigation",    name = "navigation-compose",        version.ref = "navigationCompose" }

# ── Lifecycle ────────────────────────────────────────────────────────────────
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",     name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }

# ── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android                = { group = "com.google.dagger",      name = "hilt-android",              version.ref = "hilt" }
hilt-android-compiler       = { group = "com.google.dagger",      name = "hilt-android-compiler",     version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",          name = "hilt-navigation-compose",   version.ref = "hiltNavigationCompose" }

# ── Room ─────────────────────────────────────────────────────────────────────
room-runtime                = { group = "androidx.room",          name = "room-runtime",              version.ref = "room" }
room-ktx                    = { group = "androidx.room",          name = "room-ktx",                  version.ref = "room" }
room-compiler               = { group = "androidx.room",          name = "room-compiler",             version.ref = "room" }
room-testing                = { group = "androidx.room",          name = "room-testing",              version.ref = "roomTesting" }

# ── WorkManager ──────────────────────────────────────────────────────────────
work-runtime-ktx            = { group = "androidx.work",          name = "work-runtime-ktx",          version.ref = "workManager" }
hilt-work                   = { group = "androidx.hilt",          name = "hilt-work",                 version.ref = "hiltWork" }
hilt-compiler               = { group = "androidx.hilt",          name = "hilt-compiler",             version.ref = "hiltWork" }

# ── Retrofit & OkHttp ────────────────────────────────────────────────────────
retrofit-core               = { group = "com.squareup.retrofit2", name = "retrofit",                  version.ref = "retrofit" }
retrofit-kotlinx-converter  = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
okhttp-core                 = { group = "com.squareup.okhttp3",   name = "okhttp",                    version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",   name = "logging-interceptor",       version.ref = "okhttp" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ── Jetpack Security ─────────────────────────────────────────────────────────
security-crypto             = { group = "androidx.security",      name = "security-crypto",           version.ref = "securityCrypto" }

# ── ML Kit ───────────────────────────────────────────────────────────────────
mlkit-text-recognition      = { group = "com.google.mlkit",       name = "text-recognition",          version.ref = "mlkitTextRecognition" }

# ── Testing ──────────────────────────────────────────────────────────────────
junit                       = { group = "junit",                  name = "junit",                     version.ref = "junit" }
androidx-junit              = { group = "androidx.test.ext",      name = "junit",                     version.ref = "junitAndroid" }
androidx-espresso-core      = { group = "androidx.test.espresso", name = "espresso-core",             version.ref = "espresso" }
mockk                       = { group = "io.mockk",               name = "mockk",                     version.ref = "mockk" }
kotest-runner               = { group = "io.kotest",              name = "kotest-runner-junit5",       version.ref = "kotest" }
kotest-assertions           = { group = "io.kotest",              name = "kotest-assertions-core",     version.ref = "kotest" }
kotest-property             = { group = "io.kotest",              name = "kotest-property",            version.ref = "kotest" }
turbine                     = { group = "app.cash.turbine",       name = "turbine",                   version.ref = "turbine" }

# ── Lint (for custom lint checks) ────────────────────────────────────────────
lint-api                    = { group = "com.android.tools.lint",  name = "lint-api",                  version.ref = "lint" }
lint-checks                 = { group = "com.android.tools.lint",  name = "lint-checks",               version.ref = "lint" }
lint-tests                  = { group = "com.android.tools.lint",  name = "lint-tests",                version.ref = "lint" }


[plugins]
android-application         = { id = "com.android.application",      version.ref = "agp" }
android-library             = { id = "com.android.library",          version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp",       version.ref = "ksp" }
hilt                        = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",    version.ref = "kotlin" }


[bundles]
# Compose UI bundle — import this in modules that show any Compose UI.
composeUi = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "lifecycle-viewmodel-compose",
    "lifecycle-runtime-compose",
]

# Room bundle — import in :core:database.
room = [
    "room-runtime",
    "room-ktx",
]

# Retrofit + OkHttp bundle — import in :core:sync and :core:intelligence.
network = [
    "retrofit-core",
    "retrofit-kotlinx-converter",
    "okhttp-core",
    "okhttp-logging",
    "kotlinx-serialization-json",
]

# Testing bundle — import in every module's testImplementation block.
testing = [
    "junit",
    "mockk",
    "kotest-runner",
    "kotest-assertions",
    "kotest-property",
    "turbine",
]
