# gradle.properties — Student OS
# Project-wide Gradle settings.

# ── JVM ───────────────────────────────────────────────────────────────────────
# Run the Kotlin compiler daemon inside the Gradle daemon to reduce startup cost.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── Android ───────────────────────────────────────────────────────────────────
# Use the AndroidX library namespace (required for all modern Android projects).
android.useAndroidX=true

# ── Kotlin ────────────────────────────────────────────────────────────────────
# Enable the Kotlin code style for IDE formatting.
kotlin.code.style=official

# ── Compose ───────────────────────────────────────────────────────────────────
# Required for the Kotlin Compose compiler plugin (kotlin.plugin.compose).
# This flag is automatically set by the new Compose plugin; kept explicit for clarity.
android.defaults.buildfeatures.compose=true
android.nonFinalResIds=false

# ── Performance ───────────────────────────────────────────────────────────────
# Build modules in parallel where dependency graph allows.
org.gradle.parallel=true
# Cache build outputs across builds to speed up incremental builds.
org.gradle.caching=true
# Configure the Gradle daemon for better performance.
org.gradle.configureondemand=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
